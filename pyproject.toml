[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    ".venv_test",
    "venv",
    "__pycache__",
    "backend/core/migrations",
    "research/notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
pythonpath = ["ml"]
