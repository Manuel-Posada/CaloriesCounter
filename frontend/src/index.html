<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CaloriesCounter</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Inter: primary family in --font-sans; falls back to system UI fonts if unavailable. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
  >
  <script>
    // Apply theme before first paint to prevent a white flash.
    (function () {
      try {
        var mode = localStorage.getItem('cc.theme') || 'system';
        var dark = mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var accent = localStorage.getItem('cc.accent');
        if (accent && accent !== 'green') document.documentElement.dataset.accent = accent;
      } catch (e) {
        /* localStorage blocked: fall back to default light theme. */
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
